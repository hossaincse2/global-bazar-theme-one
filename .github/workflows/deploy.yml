name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build & Lint (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

  deploy:
    name: Deploy via SSH & PM2 (CD)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH & PM2 Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.S1_SSH_HOST }}
          username: ${{ secrets.S1_SSH_USER }}
          key: ${{ secrets.S1_SSH_KEY }}
          port: ${{ secrets.S1_SSH_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            TARGET_DIR="${{ secrets.S1_TARGET_DIR || '~/global-bazar' }}"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            npm ci
            npm run build
            pm2 restart ebazar || pm2 start npm --name "ebazar" -- start
            pm2 save
